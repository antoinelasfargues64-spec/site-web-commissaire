<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Antoine Lasfargues</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Inter:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        if (performance.getEntriesByType("navigation")[0] && performance.getEntriesByType("navigation")[0].type === "reload") {
            window.location.href = "index.html";
        } else {
            if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
            window.scrollTo(0, 0);
        }
    </script>
    <style>
        :root {
            --racing-red: #e60000;
            --dark-bg: #0a0a0a;
        }
        
        html, body { overflow-x: hidden; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-bg); 
            color: #f3f4f6; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        ::selection { background-color: var(--racing-red); color: #ffffff; }
        ::-moz-selection { background-color: var(--racing-red); color: #ffffff; }

        .font-racing { font-family: 'Teko', sans-serif; text-transform: uppercase; }

        .nav-link { position: relative; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -2px; left: 0; background-color: var(--racing-red); transition: width 0.3s; }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        
        .media-container img, .media-container video {
            backface-visibility: hidden;
            transform: translateZ(0);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- MENU DE NAVIGATION -->
    <nav class="fixed top-0 w-full z-50 pointer-events-none">
        <div class="max-w-7xl mx-auto w-full flex justify-end p-4 md:p-6 md:px-8">
            <div class="flex gap-4 md:gap-8 pointer-events-auto bg-black bg-opacity-60 p-3 md:p-4 rounded-lg backdrop-blur-md border border-gray-800 shadow-xl">
                <a href="index.html" class="nav-link text-white hover:text-red-500 font-racing text-lg md:text-2xl tracking-widest transition-colors uppercase">Accueil</a>
                <a href="about.html" class="nav-link text-white hover:text-red-500 font-racing text-lg md:text-2xl tracking-widest transition-colors uppercase">À propos</a>
                <a href="gallery.html" class="nav-link active text-white hover:text-red-500 font-racing text-lg md:text-2xl tracking-widest transition-colors uppercase">Galerie</a>
            </div>
        </div>
    </nav>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="fixed inset-0 bg-black bg-opacity-95 z-[150] hidden flex-col justify-center items-center opacity-0 transition-opacity duration-300">
        <button onclick="fermerImage()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors focus:outline-none z-[160] p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 md:h-12 md:w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        <button onclick="event.stopPropagation(); naviguerImage(-1)" class="absolute left-1 md:left-8 text-white hover:text-red-600 transition-colors focus:outline-none z-[160] p-2 md:p-4 group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 md:h-16 md:w-16 drop-shadow-2xl group-hover:-translate-x-2 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7" /></svg>
        </button>
        
        <img id="lightbox-img" src="" alt="Plein écran" class="hidden max-h-[90vh] max-w-[95vw] md:max-w-[85vw] object-contain shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-gray-900 transition-opacity duration-300">
        <video id="lightbox-video" class="hidden max-h-[90vh] max-w-[95vw] md:max-w-[85vw] object-contain shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-gray-900" controls autoplay playsinline loop></video>
        
        <button onclick="event.stopPropagation(); naviguerImage(1)" class="absolute right-1 md:right-8 text-white hover:text-red-600 transition-colors focus:outline-none z-[160] p-2 md:p-4 group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 md:h-16 md:w-16 drop-shadow-2xl group-hover:translate-x-2 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7" /></svg>
        </button>
    </div>

    <!-- SECTION GALERIE CENTRÉE (MASONRY) -->
    <section class="flex-grow pt-40 md:pt-48 pb-20 w-full relative z-10 overflow-hidden">
        
        <div class="max-w-6xl mx-auto px-4 sm:px-6 w-full flex flex-col items-center">
            
            <!-- TITRE -->
            <div class="mb-16 md:mb-24 relative flex justify-center items-center w-full">
                <div class="hidden sm:block text-[5rem] md:text-[8rem] lg:text-[10rem] font-bold text-gray-400 opacity-5 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 -z-10 tracking-tighter select-none whitespace-nowrap">SNAPSHOTS</div>
                <h2 class="text-4xl md:text-5xl lg:text-6xl font-bold inline-block border-l-4 border-r-4 border-red-600 px-6 md:px-8 uppercase tracking-wider text-white font-racing bg-black bg-opacity-40 rounded-xl py-2 shadow-2xl">Galerie <span class="text-gray-500">Photos & Vidéos</span></h2>
            </div>

            <!-- GRILLE MASONRY CENTRÉE 3 COLONNES -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 md:gap-8 w-full items-start" id="gallery-grid">
                
                <!-- Colonne 1 -->
                <div class="flex flex-col gap-6 md:gap-8 w-full">
                    <div class="w-full aspect-[4/3] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <video preload="metadata" poster="photos-albi/albi1.jpg" autoplay loop muted playsinline class="w-full h-full object-cover media-element pointer-events-none transition-transform duration-700 ease-in-out group-hover:scale-105">
                            <source src="photos-albi/albi4.mp4" type="video/mp4">
                        </video>
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>

                    <div class="w-full aspect-[3/4] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos_commissaire/header 2.jpg" alt="Drapeau bleu" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>

                    <div class="w-full aspect-[4/3] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos-albi/albi3.jpg" alt="Albi 3" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>
                </div>

                <!-- Colonne 2 -->
                <div class="flex flex-col gap-6 md:gap-8 w-full">
                    <div class="w-full aspect-[3/4] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos_commissaire/header 1.jpg" alt="Action piste" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>

                    <div class="w-full aspect-[4/3] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos-albi/albi2.jpg" alt="Albi 2" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>

                    <div class="w-full aspect-[3/4] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos_commissaire/header 3.jpg" alt="Safety Car" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>
                </div>

                <!-- Colonne 3 -->
                <div class="flex flex-col gap-6 md:gap-8 w-full">
                    <div class="w-full aspect-square bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos-albi/albi1.jpg" alt="Albi 1" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>

                    <div class="w-full aspect-[3/4] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos_commissaire/about.jpg" alt="En tenue" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>

                    <div class="w-full aspect-[3/4] bg-[#161616] overflow-hidden rounded-2xl border border-gray-800 relative group cursor-pointer shadow-xl media-container" onclick="ouvrirMedia(this)">
                        <img src="photos-motos/départ-fsbk.jpg" alt="Départ FSBK" class="w-full h-full object-cover transition-transform duration-700 ease-in-out group-hover:scale-105 media-element">
                        <div class="absolute inset-0 bg-red-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                    </div>
                </div>

            </div>
        </div>

    </section>

    <!-- SCRIPTS POUR LA LIGHTBOX -->
    <script>
        let galerieActuelle = [];
        let indexMediaActuel = 0;

        function ouvrirMedia(element) {
            const grille = document.getElementById('gallery-grid');
            const mediaNodes = grille.querySelectorAll('.media-element');
            
            galerieActuelle = Array.from(mediaNodes).map(node => {
                if (node.tagName.toLowerCase() === 'video') return { type: 'video', src: node.querySelector('source').src };
                return { type: 'img', src: node.src };
            });

            const elementClique = element.querySelector('.media-element');
            const srcClique = elementClique.tagName.toLowerCase() === 'video' ? elementClique.querySelector('source').src : elementClique.src;
            indexMediaActuel = galerieActuelle.findIndex(m => m.src === srcClique);

            afficherDansLightbox();
            
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            setTimeout(() => { lightbox.classList.remove('opacity-0'); }, 10);
            
            lightbox.onclick = function(e) { if (e.target.id === 'lightbox') fermerImage(); };
            document.addEventListener('keydown', gestionClavierLightbox);
        }

        function afficherDansLightbox() {
            const media = galerieActuelle[indexMediaActuel];
            const imgEl = document.getElementById('lightbox-img');
            const vidEl = document.getElementById('lightbox-video');
            
            if (media.type === 'video') {
                imgEl.classList.add('hidden');
                imgEl.src = '';
                vidEl.classList.remove('hidden');
                vidEl.src = media.src;
                vidEl.load();
                let playPromise = vidEl.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }
            } else {
                vidEl.classList.add('hidden');
                vidEl.pause();
                vidEl.src = '';
                imgEl.classList.remove('hidden');
                imgEl.src = media.src;
            }
        }

        function naviguerImage(direction) {
            indexMediaActuel += direction;
            if (indexMediaActuel < 0) indexMediaActuel = galerieActuelle.length - 1;
            else if (indexMediaActuel >= galerieActuelle.length) indexMediaActuel = 0;
            afficherDansLightbox();
        }

        function fermerImage() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden'); lightbox.classList.remove('flex');
                document.getElementById('lightbox-img').src = '';
                document.getElementById('lightbox-video').pause();
                document.getElementById('lightbox-video').src = '';
            }, 300);
            document.removeEventListener('keydown', gestionClavierLightbox);
        }

        function gestionClavierLightbox(e) {
            if (e.key === 'ArrowRight') naviguerImage(1);
            else if (e.key === 'ArrowLeft') naviguerImage(-1);
            else if (e.key === 'Escape') fermerImage();
        }
    </script>
</body>
</html>
